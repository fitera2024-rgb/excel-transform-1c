{% extends "base.html" %}
{% block content %}
<section class="card narrow" data-testid="candidate-choice">
  <p class="eyebrow">Найдено несколько диапазонов</p>
  <h1>Выберите подготовленный диапазон</h1>
  <p>Сервис не угадывает источник молча.</p>
  <form method="post" action="/uploads/{{ pending.upload_id }}/process" data-candidate-processing-form>
    {% for candidate in pending.candidates %}
    <label class="choice"><input type="radio" name="candidate_id" value="{{ candidate.candidate_id }}" required> {{ candidate.label }}</label>
    {% endfor %}
    <p class="processing-state" data-testid="candidate-processing-state" aria-live="polite" hidden>Файл загружается и анализируется; не закрывайте страницу</p>
    <button type="submit" data-testid="candidate-process-submit">Продолжить</button>
  </form>
  <form method="post" action="/uploads/{{ pending.upload_id }}/reset"><button class="secondary">Сбросить и выбрать другой файл</button></form>
</section>
<script>
(() => {
  const form = document.querySelector("[data-candidate-processing-form]");
  const button = form.querySelector('[data-testid="candidate-process-submit"]');
  const state = form.querySelector('[data-testid="candidate-processing-state"]');
  form.addEventListener("submit", (event) => {
    if (form.dataset.submitting === "true") {
      event.preventDefault();
      return;
    }
    form.dataset.submitting = "true";
    form.setAttribute("aria-busy", "true");
    state.hidden = false;
    button.disabled = true;
    button.textContent = "Обработка…";
  });
})();
</script>
{% endblock %}
