[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-transform-1c"
version = "0.1.0"
description = "Local Excel to OPIU Light preview and export service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
]

[project.scripts]
excel-transform-1c = "excel_transform_1c.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
excel_transform_1c = ["ui/templates/*.html", "ui/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: adapter and persistence integration tests",
  "ui: local web user-flow smoke tests",
]
