name: Publish verified FITERA owner-smoke source

on:
  push:
    branches:
      - feat/final-owner-smoke-fitera-v1
    paths:
      - "migration/final-owner-smoke/**"
      - ".github/workflows/apply-final-owner-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-final-owner-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/final-owner-smoke-fitera-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and apply already verified patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(migration/final-owner-smoke/part-*.b64)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test ${#parts[@]} -eq 6
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > /tmp/final-owner-smoke.patch.gz
          test "$(wc -c < /tmp/final-owner-smoke.patch.gz)" -eq 50647
          echo "8dcec3226100b735043b553ff248b8c6a3919cd58790ea9781e6fadcb26f699d  /tmp/final-owner-smoke.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout /tmp/final-owner-smoke.patch.gz > /tmp/final-owner-smoke.patch
          test "$(wc -c < /tmp/final-owner-smoke.patch)" -eq 174450
          echo "1c1aab0e56e9fe6941ed3de48e533622f3d6e5ac469fe8f0cd8920e128cf6dbe  /tmp/final-owner-smoke.patch" | sha256sum --check --strict
          git apply --check --binary /tmp/final-owner-smoke.patch
          git apply --binary /tmp/final-owner-smoke.patch
          rm -f .github/workflows/final-owner-smoke-package.yml
          rm -rf migration/final-owner-smoke
          git diff --check 41e8b9b6847a1cc55d58e7e027dec771117b0cde
          test -z "$(git ls-files '*.xlsx' '*.xls' '*.xlsm' '*.xlsb')"
          echo "has_patch=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push source implementation
        if: steps.apply.outputs.has_patch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fitera2024-rgb"
          git config user.email "fitera2024@gmail.com"
          git add -A
          git commit -m "feat: deliver FITERA owner-smoke source and real Excel repair"
          git push origin HEAD:feat/final-owner-smoke-fitera-v1
