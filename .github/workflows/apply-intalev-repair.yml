name: Apply Intalev repair

on:
  push:
    branches: [feat/intalev-repair-and-confirmations]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intalev-repair-and-confirmations
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble and apply
        shell: bash
        run: |
          set -euo pipefail
          parts=(governance/patches/intalev-repair/part-*.b64)
          cat "${parts[@]}" | tr -d '[:space:]' | base64 --decode > /tmp/repair.patch.gz
          test "$(wc -c < /tmp/repair.patch.gz)" -eq 30680
          gzip -dc /tmp/repair.patch.gz > /tmp/repair.patch
          test "$(wc -c < /tmp/repair.patch)" -eq 121617
          git apply --3way /tmp/repair.patch
          rm -rf governance/patches/intalev-repair
      - name: Verify
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[test]'
          git diff --check
          python -m compileall -q src tests scripts
          python -m pytest -q
          node --check src/excel_transform_1c/ui/static/run.js
      - name: Push
        shell: bash
        run: |
          git config user.name fitera2024-rgb
          git config user.email fitera2024@gmail.com
          git add -A
          git commit -m 'feat: repair Intalev workbooks and persist CFO confirmations'
          git push origin HEAD:feat/intalev-repair-and-confirmations
