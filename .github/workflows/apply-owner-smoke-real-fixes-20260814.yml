name: Apply real owner smoke fixes 20260814

on:
  push:
    branches:
      - fix/owner-smoke-real-files-20260814
    paths:
      - "migration/owner-smoke-real-fixes-20260814/**"
      - ".github/workflows/apply-owner-smoke-real-fixes-20260814.yml"

permissions:
  contents: write

concurrency:
  group: apply-owner-smoke-real-fixes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-test-and-publish:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip owner smoke apply]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/owner-smoke-real-files-20260814

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          cat migration/owner-smoke-real-fixes-20260814/part-*.b64 | base64 --decode > /tmp/owner-smoke-real-fixes.patch.xz
          echo "fa45d9c9ea24701753e7a55fb738c3e439802bc9d11d4277a3a2999cbb83a378  /tmp/owner-smoke-real-fixes.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/owner-smoke-real-fixes.patch.xz > /tmp/owner-smoke-real-fixes.patch
          echo "Patch SHA-256 verified"

      - name: Apply implementation patch
        shell: bash
        run: |
          git apply --index /tmp/owner-smoke-real-fixes.patch
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete real owner smoke for CFO and Intalev OPIU"
          echo "IMPLEMENTATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install -e ".[test]"

      - name: Compile and run full regression
        shell: bash
        run: |
          python -m compileall -q src tests
          node --check src/excel_transform_1c/ui/static/run.js
          python -m pytest tests/unit -q
          python -m pytest tests/integration -q
          python -m pytest tests/ui -q
          python -m pytest -q
          tracked_files="$(git ls-files '*.xlsx' '*.xls' '*.xlsm' '*.xlsb')"
          if [ -n "$tracked_files" ]; then
            echo "::error::Real Excel workbooks must not be tracked"
            printf '%s\n' "$tracked_files"
            exit 1
          fi

      - name: Build and verify wheel
        shell: bash
        run: |
          rm -rf dist build
          python -m build --wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          required = {
              'excel_transform_1c/baselines/erp_articles.json',
              'excel_transform_1c/baselines/intalev_cfos.json',
              'excel_transform_1c/baselines/manifest.json',
              'excel_transform_1c/baselines/organizations.json',
              'excel_transform_1c/baselines/scenarios.json',
          }
          missing = required - names
          assert not missing, sorted(missing)
          print(f'Wheel verified: {wheels[0]}')
          PY

      - name: Upload verified wheel
        uses: actions/upload-artifact@v4
        with:
          name: owner-smoke-real-fixes-20260814
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

      - name: Remove one-time migration payload and publish verified commits
        shell: bash
        run: |
          git rm -r migration/owner-smoke-real-fixes-20260814
          git rm .github/workflows/apply-owner-smoke-real-fixes-20260814.yml
          git commit -m "chore: remove completed owner smoke migration payload [skip owner smoke apply]"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:fix/owner-smoke-real-files-20260814
          echo "Implementation commit: $IMPLEMENTATION_SHA"
          echo "Final cleanup commit: $(git rev-parse HEAD)"
