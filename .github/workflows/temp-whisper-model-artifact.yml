name: Temporary Whisper model artifact

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download multilingual Whisper small q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-small-q5_1.bin \
            https://github.com/Bagani/rec2text-models/raw/refs/heads/main/ggml-small-q5_1.bin
          test "$(stat -c%s ggml-small-q5_1.bin)" -eq 190085487
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin" | sha256sum -c -

      - name: Upload model as short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-small-q5_1
          path: ggml-small-q5_1.bin
          retention-days: 1
          compression-level: 0
