name: Apply staged tax and CFO implementation

on:
  push:
    branches:
      - feat/tax-cfo-bulk
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tax-cfo-self-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/tax-cfo-bulk
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and inspect staged patch
        id: decode
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(governance/patches/tax-cfo-self/part-*.b64)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "No staged patch parts remain; nothing to apply."
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode | gzip --decompress > /tmp/tax-cfo.patch
          echo "has_patch=true" >> "$GITHUB_OUTPUT"
          echo "Decoded patch bytes: $(wc -c < /tmp/tax-cfo.patch)"
          echo "Patch file list:"
          grep '^+++ b/' /tmp/tax-cfo.patch | sed 's#^+++ b/##' | sort -u
          echo "Patch preview:"
          sed -n '1,80p' /tmp/tax-cfo.patch
          git apply --check /tmp/tax-cfo.patch

      - name: Apply staged implementation
        if: steps.decode.outputs.has_patch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/tax-cfo.patch
          rm -rf governance/patches/tax-cfo-self
          rm -f .github/workflows/apply-tax-cfo-self.yml
          git status --short

      - name: Verify implementation
        if: steps.decode.outputs.has_patch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[test]'
          git diff --check
          python -m compileall -q src tests scripts
          python -m pytest tests/unit -q
          python -m pytest tests/integration -q
          python -m pytest tests/ui -q
          python -m pytest -q
          node --check src/excel_transform_1c/ui/static/run.js
          tracked="$(git ls-files '*.xlsx' '*.xls' '*.xlsm')"
          if [ -n "$tracked" ]; then
            printf '%s\n' "$tracked"
            exit 1
          fi

      - name: Commit and push verified implementation
        if: steps.decode.outputs.has_patch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fitera2024-rgb"
          git config user.email "fitera2024@gmail.com"
          git add -A
          git commit -m "feat: implement tax and Intalev CFO bulk workflows [self-apply-done]"
          git push origin HEAD:feat/tax-cfo-bulk
