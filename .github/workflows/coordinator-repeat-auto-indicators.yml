name: Coordinator Repeat Auto Indicators

on:
  push:
    branches:
      - feat/final-owner-smoke-fitera-v2
    paths:
      - .github/workflows/coordinator-repeat-auto-indicators.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Merge canonical base and resolve conflicts semantically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fitera2024-rgb"
          git config user.email "fitera2024@gmail.com"
          previous=ffcb887844638eaac7a059b58150bdc200bb7e34
          canonical=1b56211630bbc8d3a5ad094b32bb8f9481529c6c
          git merge-base --is-ancestor "$previous" HEAD
          git fetch origin "$canonical"
          set +e
          git merge --no-ff --no-commit "$canonical"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi
          git diff --name-only --diff-filter=U | tee /tmp/conflicts.txt

          # Reconstruct only overlapping files from the first parent and apply
          # the reviewed field-level semantic patches. Other canonical files
          # stay as produced by Git's normal merge.
          for f in \
            src/excel_transform_1c/application/service.py \
            src/excel_transform_1c/core/models.py \
            src/excel_transform_1c/ui/app.py \
            src/excel_transform_1c/ui/templates/run.html; do
            git show "HEAD:$f" > "$f"
            sed -i 's/\r$//' "$f"
          done
          sed -i 's/\r$//' src/excel_transform_1c/core/indicator_matching.py
          cat governance/tmp/coord/service.part* > /tmp/service.patch
          cat governance/tmp/coord/ui.part* > /tmp/ui.patch
          git apply -p2 --directory=src /tmp/service.patch
          git apply -p2 --directory=src /tmp/ui.patch
          git add \
            src/excel_transform_1c/application/service.py \
            src/excel_transform_1c/core/models.py \
            src/excel_transform_1c/core/indicator_matching.py \
            src/excel_transform_1c/ui/app.py \
            src/excel_transform_1c/ui/templates/run.html
          test -z "$(git diff --name-only --diff-filter=U)"

          # Temporary coordinator transport files must not survive the merge.
          git rm -r governance/tmp/coord .github/workflows/coordinator-repeat-auto-indicators.yml

      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install -e ".[test]"

      - name: Combined verification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --cached --check
          python -m compileall -q src tests scripts
          python -m pytest tests/unit -q
          python -m pytest tests/integration -q
          python -m pytest tests/ui -q
          python -m pytest -q
          node --check src/excel_transform_1c/ui/static/run.js

          test -f tests/integration/test_source_cfo_mapping.py
          test -f tests/ui/test_source_cfo_mapping_ui.py
          test -f tests/unit/test_intalev_flat_layout.py
          test -f tests/unit/test_indicator_empty_hierarchy.py
          test -f tests/integration/test_indicator_unresolved_rows.py
          test -f tests/ui/test_indicator_unresolved_ui.py
          grep -q 'source_cfo_mappings' src/excel_transform_1c/adapters/persistence.py
          grep -q 'source_reporting_unit' src/excel_transform_1c/core/models.py
          grep -q 'def indicator_unresolved_rows' src/excel_transform_1c/application/service.py
          grep -q 'return " → ".join(parts) if parts\[2\] else ""' src/excel_transform_1c/core/indicator_matching.py
          grep -q 'Исходный ЦФО → ЦФО Инталев → узел 1С' src/excel_transform_1c/ui/templates/run.html
          grep -q 'indicator_counts.attention > 0' src/excel_transform_1c/ui/templates/run.html

      - name: Commit ordinary merge and push
        shell: bash
        run: |
          set -euo pipefail
          canonical=1b56211630bbc8d3a5ad094b32bb8f9481529c6c
          git add -A
          git commit -m "merge: integrate canonical owner baseline and repeat indicator QA"
          head=$(git rev-parse HEAD)
          parents=$(git show -s --format=%P HEAD)
          echo "MERGE_COMMIT=$head"
          echo "PARENTS=$parents"
          test "$(printf '%s\n' "$parents" | wc -w)" -eq 2
          test "$(printf '%s\n' "$parents" | awk '{print $2}')" = "$canonical"
          git push origin HEAD:feat/final-owner-smoke-fitera-v2
