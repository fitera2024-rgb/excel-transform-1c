name: Bulk Confirm CI and User Package

on:
  push:
    branches:
      - feat/bulk-confirm-filled-erp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bulk-confirm-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Full regression and repository guard
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"

      - name: Compile source and tests
        run: python -m compileall -q src tests scripts

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Integration tests
        run: python -m pytest tests/integration -q

      - name: UI tests
        run: python -m pytest tests/ui -q

      - name: Full regression suite
        run: python -m pytest -q

      - name: JavaScript syntax
        run: node --check src/excel_transform_1c/ui/static/run.js

      - name: Patch hygiene
        run: git diff --check 6f2f0aa1121093f51b229a7fc4e402b13166602f...HEAD

      - name: Reject tracked business Excel
        shell: bash
        run: |
          tracked_files="$(git ls-files '*.xlsx' '*.xls' '*.xlsm')"
          if [ -n "$tracked_files" ]; then
            echo "::error::Excel workbooks must not be committed."
            printf '%s\n' "$tracked_files"
            exit 1
          fi
          echo "No tracked Excel workbooks found."

  user-package:
    name: Offline Windows user package
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build application wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir wheelhouse

      - name: Download offline Windows dependencies
        shell: pwsh
        run: |
          python -m pip download --dest wheelhouse --only-binary=:all: `
            "fastapi>=0.116,<1" `
            "jinja2>=3.1,<4" `
            "msoffcrypto-tool>=6,<7" `
            "openpyxl>=3.1,<4" `
            "python-multipart>=0.0.20,<1" `
            "uvicorn>=0.35,<1"

      - name: Build ZIP
        shell: pwsh
        run: |
          python scripts/build_user_package.py `
            --wheel-dir wheelhouse `
            --output-dir dist `
            --build-sha $env:GITHUB_SHA

      - name: Smoke real background launcher, restart cleanup and stop
        shell: pwsh
        run: |
          $package = Join-Path $PWD "dist\EXCEL_TO_OPIU_LIGHT_USER"
          $cmdLauncher = Join-Path $package "START_SERVICE.cmd"
          $psLauncher = Join-Path $package "START_SERVICE.ps1"
          $stopCmd = Join-Path $package "STOP_SERVICE.cmd"
          $stopPs = Join-Path $package "STOP_SERVICE.ps1"
          foreach ($required in @($cmdLauncher, $psLauncher, $stopCmd, $stopPs)) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "Required launcher is missing: $required"
            }
          }
          $cmdText = Get-Content -LiteralPath $cmdLauncher -Raw
          if ($cmdText -notmatch "START_SERVICE.ps1") {
            throw "CMD launcher does not delegate to the PowerShell launcher"
          }

          $runtime = Join-Path $env:RUNNER_TEMP "opiu-user-package-runtime"
          Remove-Item -LiteralPath $runtime -Recurse -Force -ErrorAction SilentlyContinue
          $env:OPIU_PORT = "8765"
          $env:OPIU_RUNTIME_DIR = $runtime
          $env:OPIU_NONINTERACTIVE = "1"

          function Show-LauncherLogs {
            foreach ($path in @(
              (Join-Path $package "startup.log"),
              (Join-Path $runtime "service.stdout.log"),
              (Join-Path $runtime "service.stderr.log")
            )) {
              if (Test-Path -LiteralPath $path) {
                Write-Host "--- $path ---"
                Get-Content -LiteralPath $path
              }
            }
          }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $psLauncher
          if ($LASTEXITCODE -ne 0) {
            Show-LauncherLogs
            throw "First packaged background launch failed"
          }
          $pidPath = Join-Path $runtime "service.pid"
          $urlPath = Join-Path $runtime "service.url"
          $firstPid = [int](Get-Content -LiteralPath $pidPath -Raw)
          $serviceUrl = (Get-Content -LiteralPath $urlPath -Raw).Trim()
          $health = Invoke-RestMethod -Uri "$serviceUrl/health" -TimeoutSec 5
          if ($health.status -ne "ok") {
            Show-LauncherLogs
            throw "First packaged service health failed"
          }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $psLauncher
          if ($LASTEXITCODE -ne 0) {
            Show-LauncherLogs
            throw "Second packaged launch failed"
          }
          $secondPid = [int](Get-Content -LiteralPath $pidPath -Raw)
          if ($secondPid -eq $firstPid) {
            throw "Restart did not replace the previous service process"
          }
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            if (-not (Get-Process -Id $firstPid -ErrorAction SilentlyContinue)) {
              break
            }
            Start-Sleep -Milliseconds 250
          }
          if (Get-Process -Id $firstPid -ErrorAction SilentlyContinue) {
            throw "Previous service process remained alive after restart cleanup"
          }
          $health = Invoke-RestMethod -Uri "$serviceUrl/health" -TimeoutSec 5
          if ($health.status -ne "ok") {
            Show-LauncherLogs
            throw "Restarted packaged service health failed"
          }
          $homeResponse = Invoke-WebRequest -UseBasicParsing -Uri "$serviceUrl/" -TimeoutSec 5
          if ($homeResponse.StatusCode -ne 200 -or $homeResponse.Content -notmatch "OPIU") {
            Show-LauncherLogs
            throw "Packaged home page smoke failed"
          }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $stopPs
          if ($LASTEXITCODE -ne 0) {
            Show-LauncherLogs
            throw "Packaged stop launcher failed"
          }
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            try {
              Invoke-RestMethod -Uri "$serviceUrl/health" -TimeoutSec 1 | Out-Null
            } catch {
              break
            }
            Start-Sleep -Milliseconds 250
          }
          try {
            Invoke-RestMethod -Uri "$serviceUrl/health" -TimeoutSec 1 | Out-Null
            throw "Service port remained open after STOP_SERVICE.ps1"
          } catch {
            if ($_.Exception.Message -eq "Service port remained open after STOP_SERVICE.ps1") {
              throw
            }
          }

      - name: Upload user ZIP
        uses: actions/upload-artifact@v4
        with:
          name: EXCEL_TO_OPIU_LIGHT_USER_WINDOWS
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
