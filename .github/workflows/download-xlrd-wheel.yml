name: Download xlrd wheel

on:
  push:
    branches:
      - feat/intalev-repair-final-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download universal xlrd wheel
        run: python -m pip download --only-binary=:all: --dest wheelhouse "xlrd==2.0.2"
      - uses: actions/upload-artifact@v4
        with:
          name: XLRD_WHEEL
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 2
