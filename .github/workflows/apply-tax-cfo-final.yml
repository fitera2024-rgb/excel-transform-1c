name: Apply verified Intalev repair implementation

on:
  push:
    branches:
      - feat/intalev-repair-and-confirmations
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intalev-repair-self-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: feat/intalev-repair-and-confirmations
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Decode and inspect staged repair patch
        id: decode
        shell: bash
        run: |
          set -euo pipefail
          staged="governance/patches/intalev-repair/implementation.patch.gz.b64"
          if [ ! -f "$staged" ]; then
            echo "No staged repair patch remains; verified implementation is already applied."
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tr -d '\r\n' < "$staged" | base64 --decode > /tmp/intalev-repair.patch.gz
          test "$(wc -c < /tmp/intalev-repair.patch.gz)" -eq 30680
          echo "a979a8e61dbe798acd6cbc164d3e9c82a0799962d918c9873f6b977042c12205  /tmp/intalev-repair.patch.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/intalev-repair.patch.gz > /tmp/intalev-repair.patch
          test "$(wc -c < /tmp/intalev-repair.patch)" -eq 121617
          echo "c1c53863fe641882b84cabb0194fe05cc365cbeea44eba318c2825b8d9db56f0  /tmp/intalev-repair.patch" | sha256sum --check
          echo "Files in repair patch:"
          grep '^+++ b/' /tmp/intalev-repair.patch | sed 's#^+++ b/##' | sort -u
          git apply --check /tmp/intalev-repair.patch
          echo "has_patch=true" >> "$GITHUB_OUTPUT"

      - name: Apply repair implementation
        if: steps.decode.outputs.has_patch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/intalev-repair.patch
          rm -rf governance/patches/intalev-repair
          git status --short

      - name: Install project and test dependencies
        if: steps.decode.outputs.has_patch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[test]'

      - name: Verify repaired workbook and confirmation flows
        if: steps.decode.outputs.has_patch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q src tests scripts
          python -m pytest tests/unit -q
          python -m pytest tests/integration -q
          python -m pytest tests/ui -q
          python -m pytest -q
          node --check src/excel_transform_1c/ui/static/run.js
          tracked="$(git ls-files '*.xlsx' '*.xls' '*.xlsm')"
          if [ -n "$tracked" ]; then
            echo "Tracked Excel files are forbidden:"
            printf '%s\n' "$tracked"
            exit 1
          fi

      - name: Commit and push verified implementation
        if: steps.decode.outputs.has_patch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fitera2024-rgb"
          git config user.email "fitera2024@gmail.com"
          git add -A
          git commit -m "feat: repair Intalev workbooks and persist CFO confirmations"
          git push origin HEAD:feat/intalev-repair-and-confirmations
