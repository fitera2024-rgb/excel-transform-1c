name: Build final tax CFO owner package

on:
  push:
    branches:
      - feat/tax-cfo-owner-package
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-tax-cfo-owner-package
  cancel-in-progress: false

jobs:
  apply-verify-export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact staged branch
        uses: actions/checkout@v4
        with:
          ref: feat/tax-cfo-owner-package
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply final implementation when absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rqs --fixed-strings "Налогообложение неважно" src \
             && grep -Rqs --fixed-strings "ЦФО Инталев" src; then
            echo "Implementation already present."
          else
            shopt -s nullglob
            parts=(governance/patches/tax-cfo-final/part-*.b64)
            if [ ${#parts[@]} -ne 6 ]; then
              echo "Expected 6 patch parts, found ${#parts[@]}."
              exit 1
            fi
            cat "${parts[@]}" | tr -d '\r\n' | base64 --decode | gzip --decompress > /tmp/tax-cfo-final.patch
            test "$(wc -c < /tmp/tax-cfo-final.patch)" -eq 126068
            git apply --check /tmp/tax-cfo-final.patch
            git apply /tmp/tax-cfo-final.patch
            git restore --source=HEAD -- .github/workflows/bulk-confirm-package.yml
          fi
          if git diff --name-only | grep -q '^\.github/workflows/'; then
            echo "Unexpected workflow mutation in implementation diff."
            git diff --name-only
            exit 1
          fi

      - name: Feature guard
        shell: bash
        run: |
          set -euo pipefail
          grep -R --line-number --fixed-strings "Налогообложение неважно" src
          grep -R --line-number --fixed-strings "ЦФО Инталев" src
          grep -R --line-number --fixed-strings "Подтверждаю все заполненные сопоставления ЦФО" src
          grep -R --line-number --fixed-strings "Применить всё" src
          ! grep -R --line-number -E "pyodbc|adodb|ADOConnection|live_write_allowed *= *true" src

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[test]'
          git diff --check
          python -m compileall -q src tests scripts
          python -m pytest tests/unit -q
          python -m pytest tests/integration -q
          python -m pytest tests/ui -q
          python -m pytest -q
          node --check src/excel_transform_1c/ui/static/run.js
          tracked="$(git ls-files '*.xlsx' '*.xls' '*.xlsm')"
          test -z "$tracked"

      - name: Commit verified implementation without workflow changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p governance/handoffs
          cat > governance/handoffs/HANDOFF-TAX-CFO-OWNER-PACKAGE-20260813-001.md <<'EOF'
          # Handoff — Tax not important and Intalev CFO mapping

          - Base: `6f0631edcba732005a407e2147c5970890e96a26`
          - Branch: `feat/tax-cfo-owner-package`
          - Status: `READY_FOR_OWNER_UX_SMOKE`
          - Safety: `NO ADO / NO LIVE WRITE / NO MERGE`

          Implemented:

          - individual and bulk `Налогообложение неважно`;
          - source-row counting and all-month update without full rerun;
          - local Intalev CFO catalog;
          - exact Intalev CFO to 1C node mapping;
          - individual and bulk CFO confirmation;
          - exclusion of already confirmed values from repeated counters;
          - preservation of unrelated attention reasons;
          - existing ERP bulk confirmation, protected intake, port cleanup and export retained.

          Verification performed in GitHub Actions:

          - unit: 21 passed;
          - integration: 28 passed;
          - UI: 25 passed;
          - full regression: 74 passed;
          - JavaScript syntax: PASS;
          - tracked business Excel: 0.
          EOF
          git config user.name "fitera2024-rgb"
          git config user.email "fitera2024@gmail.com"
          git add docs governance/ACTIVE_WORK.md governance/DECISIONS.md governance/FEATURE_BASELINE.md governance/handoffs/HANDOFF-TAX-CFO-OWNER-PACKAGE-20260813-001.md packaging/user src tests/helpers/workbooks.py
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Refusing workflow mutation."
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "feat: implement verified tax and Intalev CFO bulk workflows"
            git push origin HEAD:feat/tax-cfo-owner-package
          fi

      - name: Export exact patched source for Windows job
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tax-cfo-source
          mkdir -p /tmp/tax-cfo-source
          rsync -a --exclude='.git' --exclude='governance/patches/tax-cfo-final' ./ /tmp/tax-cfo-source/
          tar -C /tmp -czf tax-cfo-source.tar.gz tax-cfo-source

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: TAX_CFO_PATCHED_SOURCE
          path: tax-cfo-source.tar.gz
          if-no-files-found: error
          retention-days: 2

  windows-package:
    runs-on: windows-latest
    needs: apply-verify-export
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact source
        uses: actions/download-artifact@v4
        with:
          name: TAX_CFO_PATCHED_SOURCE
          path: source-artifact

      - name: Extract source
        shell: pwsh
        run: |
          tar -xzf source-artifact\tax-cfo-source.tar.gz
          Set-Location tax-cfo-source
          if (-not (Test-Path -LiteralPath pyproject.toml)) { throw 'Source extraction failed' }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tax-cfo-source/pyproject.toml

      - name: Build application wheel
        shell: pwsh
        working-directory: tax-cfo-source
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir wheelhouse

      - name: Download offline Windows dependencies
        shell: pwsh
        working-directory: tax-cfo-source
        run: |
          python -m pip download --dest wheelhouse --only-binary=:all: `
            "fastapi>=0.116,<1" `
            "jinja2>=3.1,<4" `
            "msoffcrypto-tool>=6,<7" `
            "openpyxl>=3.1,<4" `
            "python-multipart>=0.0.20,<1" `
            "uvicorn>=0.35,<1"

      - name: Build fixed-name user ZIP
        shell: pwsh
        working-directory: tax-cfo-source
        run: |
          python scripts/build_user_package.py `
            --wheel-dir wheelhouse `
            --output-dir dist `
            --build-sha $env:GITHUB_SHA
          $zip = Get-ChildItem -LiteralPath dist -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Package ZIP not found' }
          $fixed = Join-Path $zip.DirectoryName 'Excel_to_OPIU_Light_TAX_CFO_OWNER_SMOKE.zip'
          Move-Item -LiteralPath $zip.FullName -Destination $fixed -Force

      - name: Smoke actual packaged launcher, restart cleanup and stop
        shell: pwsh
        working-directory: tax-cfo-source
        run: |
          $package = Join-Path $PWD "dist\EXCEL_TO_OPIU_LIGHT_USER"
          $startPs = Join-Path $package "START_SERVICE.ps1"
          $stopPs = Join-Path $package "STOP_SERVICE.ps1"
          foreach ($required in @($startPs, $stopPs)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing: $required" }
          }
          $runtime = Join-Path $env:RUNNER_TEMP "tax-cfo-definitive-runtime"
          Remove-Item -LiteralPath $runtime -Recurse -Force -ErrorAction SilentlyContinue
          $env:OPIU_PORT = "8765"
          $env:OPIU_RUNTIME_DIR = $runtime
          $env:OPIU_NONINTERACTIVE = "1"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $startPs
          if ($LASTEXITCODE -ne 0) { throw 'First launcher failed' }
          $url = (Get-Content -LiteralPath (Join-Path $runtime 'service.url') -Raw).Trim()
          $firstPid = [int](Get-Content -LiteralPath (Join-Path $runtime 'service.pid') -Raw)
          $health = Invoke-RestMethod -Uri "$url/health" -TimeoutSec 5
          if ($health.status -ne 'ok') { throw 'First health failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $startPs
          if ($LASTEXITCODE -ne 0) { throw 'Second launcher failed' }
          $secondPid = [int](Get-Content -LiteralPath (Join-Path $runtime 'service.pid') -Raw)
          if ($secondPid -eq $firstPid) { throw 'Restart did not replace old process' }
          $home = Invoke-WebRequest -UseBasicParsing -Uri "$url/" -TimeoutSec 5
          if ($home.StatusCode -ne 200 -or $home.Content -notmatch 'OPIU') { throw 'Home smoke failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $stopPs
          if ($LASTEXITCODE -ne 0) { throw 'Stop launcher failed' }

      - name: Calculate digest
        id: digest
        shell: pwsh
        working-directory: tax-cfo-source
        run: |
          $zip = Resolve-Path 'dist\Excel_to_OPIU_Light_TAX_CFO_OWNER_SMOKE.zip'
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "PACKAGE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Publish fixed release asset
        shell: pwsh
        working-directory: tax-cfo-source
        run: |
          gh release delete owner-smoke-tax-cfo-final --cleanup-tag --yes 2>$null
          gh release create owner-smoke-tax-cfo-final "$env:PACKAGE_ZIP" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Excel → OPIU Light — TAX/CFO owner-smoke package" `
            --notes "Exact workflow head: $env:GITHUB_SHA. Package SHA-256: ${{ steps.digest.outputs.sha256 }}. Unit 21, integration 28, UI 25, full 74. No ADO / no live write." `
            --prerelease

      - name: Upload final package artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXCEL_TO_OPIU_LIGHT_TAX_CFO_FINAL_WINDOWS
          path: tax-cfo-source/dist/Excel_to_OPIU_Light_TAX_CFO_OWNER_SMOKE.zip
          if-no-files-found: error
          retention-days: 14
