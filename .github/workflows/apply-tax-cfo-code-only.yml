name: Apply verified tax and CFO code only

on:
  push:
    branches:
      - feat/tax-cfo-bulk-final
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tax-cfo-code-only
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: feat/tax-cfo-bulk-final
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Decode and inspect staged patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(governance/patches/tax-cfo-final/part-*.b64)
          if [ ${#parts[@]} -ne 6 ]; then
            echo "Expected exactly 6 staged patch parts, found ${#parts[@]}."
            exit 1
          fi
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode | gzip --decompress > /tmp/tax-cfo-final.patch
          test "$(wc -c < /tmp/tax-cfo-final.patch)" -eq 126068
          git apply --check /tmp/tax-cfo-final.patch

      - name: Apply implementation without workflow-file changes
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/tax-cfo-final.patch
          git restore --source=HEAD -- .github/workflows/bulk-confirm-package.yml
          git status --short
          if git diff --name-only | grep -q '^\.github/workflows/'; then
            echo "Workflow mutation remains in implementation diff."
            git diff --name-only
            exit 1
          fi

      - name: Install project and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[test]'

      - name: Verify implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q src tests scripts
          python -m pytest tests/unit -q
          python -m pytest tests/integration -q
          python -m pytest tests/ui -q
          python -m pytest -q
          node --check src/excel_transform_1c/ui/static/run.js
          tracked="$(git ls-files '*.xlsx' '*.xls' '*.xlsm')"
          if [ -n "$tracked" ]; then
            printf '%s\n' "$tracked"
            exit 1
          fi

      - name: Commit and push verified code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fitera2024-rgb"
          git config user.email "fitera2024@gmail.com"
          git add docs governance/ACTIVE_WORK.md governance/DECISIONS.md governance/FEATURE_BASELINE.md packaging/user src tests/helpers/workbooks.py
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Refusing to push a workflow change."
            exit 1
          fi
          git commit -m "feat: implement tax and Intalev CFO bulk workflows [verified]"
          git push origin HEAD:feat/tax-cfo-bulk-final
