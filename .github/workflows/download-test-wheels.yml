name: Download pure Python test wheels

on:
  push:
    branches:
      - tmp/export-owner-smoke-source-20260814
    paths:
      - .github/workflows/download-test-wheels.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download wheels
        run: |
          python -m pip download --only-binary=:all: --dest wheels xlrd==2.0.2 xlwt==1.3.0 olefile==0.47 msoffcrypto-tool==6.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: PYTHON_TEST_WHEELS
          path: wheels/*.whl
          retention-days: 2
